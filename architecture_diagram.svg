<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #111827; }
      .h2 { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #0f172a; }
      .txt { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #334155; }
      .container { stroke: #0f172a; stroke-width: 1.6; rx: 16; ry: 16; }
      .box { stroke: #0f172a; stroke-width: 1.2; rx: 12; ry: 12; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827" />
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="1176" height="306" fill="#ffffff" stroke="#111827" stroke-width="2" rx="18" ry="18" />

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" class="title">System Architecture — Mutation Network Project</text>

  <!-- Blocks (simple left-to-right flow) -->
  <rect x="55" y="120" width="240" height="170" class="container" fill="#fff7ed" />
  <text x="175" y="150" text-anchor="middle" class="h2">Input</text>
  <rect x="80" y="170" width="190" height="95" class="box" fill="#ffedd5" />
  <text x="175" y="200" text-anchor="middle" class="txt">Clone CSV Files</text>
  <text x="175" y="222" text-anchor="middle" class="small">sequences + metadata</text>
  <text x="175" y="242" text-anchor="middle" class="small">(subject / sample / time)</text>

  <rect x="335" y="120" width="280" height="170" class="container" fill="#e0f2fe" />
  <text x="475" y="150" text-anchor="middle" class="h2">Desktop App</text>
  <rect x="360" y="170" width="230" height="95" class="box" fill="#bae6fd" />
  <text x="475" y="200" text-anchor="middle" class="txt">GUI + Controls</text>
  <text x="475" y="222" text-anchor="middle" class="small">load datasets</text>
  <text x="475" y="242" text-anchor="middle" class="small">set thresholds</text>

  <rect x="655" y="120" width="310" height="170" class="container" fill="#dcfce7" />
  <text x="810" y="150" text-anchor="middle" class="h2">Core Pipeline</text>
  <rect x="680" y="170" width="260" height="95" class="box" fill="#bbf7d0" />
  <text x="810" y="197" text-anchor="middle" class="txt">Build Network (AA3)</text>
  <text x="810" y="219" text-anchor="middle" class="small">normalize + threshold</text>
  <text x="810" y="239" text-anchor="middle" class="small">compare (dataset / R1 vs R2)</text>

  <rect x="1005" y="120" width="140" height="170" class="container" fill="#fef9c3" />
  <text x="1075" y="150" text-anchor="middle" class="h2">Outputs</text>
  <rect x="1020" y="170" width="110" height="95" class="box" fill="#fde68a" />
  <text x="1075" y="198" text-anchor="middle" class="txt">HTML</text>
  <text x="1075" y="220" text-anchor="middle" class="small">plots + reports</text>
  <text x="1075" y="240" text-anchor="middle" class="small">+ CSV exports</text>

  <!-- Arrows -->
  <path d="M295 205 L335 205" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M615 205 L655 205" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M965 205 L1005 205" class="arrow" marker-end="url(#arrowhead)" />

</svg>
